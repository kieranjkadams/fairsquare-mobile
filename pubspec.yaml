name: fairsquare_mobile
description: FairSquare - Real estate investment tracking for co-investors.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^13.0.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.66.0

  # Biometrics
  local_auth: ^2.1.8

  # Push notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

  # Image picking
  image_picker: ^1.0.5

  # File handling
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  open_filex: ^4.3.4

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Environment
  flutter_dotenv: ^5.1.0

  # Utilities
  uuid: ^4.2.1
  equatable: ^2.0.5
  timeago: ^3.6.1
  currency_formatter: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/fairsquare-icon-resized.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
