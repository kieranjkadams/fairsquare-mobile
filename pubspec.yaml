name: fairsquare_mobile
description: FairSquare - Real estate investment tracking for co-investors.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.66.0
  local_auth: ^2.1.8
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  image_picker: ^1.0.5
  path_provider: ^2.1.1
  url_launcher: ^6.2.2
  open_filex: ^4.3.4
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  equatable: ^2.0.5
  timeago: ^3.6.1
  currency_formatter: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/
